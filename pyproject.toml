[project]
name = "kingdom-core-backend"
version = "0.1.0"
description = "Backend de gestion catequetica para la Parroquia El Buen Pastor de Turubamba"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }

dependencies = [
    "fastapi[standard]>=0.120.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "asyncpg>=0.30.0",
    "alembic>=1.17.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.11.0",
    "tenacity>=9.1.0",
    "cloudinary>=1.44.0",
    "uuid-utils>=0.11.0",
    "weasyprint>=67.0",
    "jinja2>=3.1.0",
    "dependency-injector>=4.48.0",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
monitoring = ["sentry-sdk[fastapi]>=2.44.0"]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "testcontainers[postgres]>=4.14.0",
    "polyfactory>=2.23.0",
    "time-machine>=2.19.0",
    "pre-commit>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kingdom"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude", ".agents", ".codex"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "DTZ",
    "T20",
    "SIM",
    "TCH",
    "RUF",
    "ASYNC",
]
ignore = [
    "B008",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/**" = ["E501"]
"src/kingdom/shared/domain/errors.py" = ["N818"]
"src/kingdom/contexts/*/domain/errors.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["kingdom"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cloudinary.*", "weasyprint.*", "dependency_injector.*", "asyncpg.*", "uuid_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=kingdom --cov-report=term-missing"
markers = [
    "integration: requiere una base de datos Postgres real",
]

[tool.coverage.run]
branch = true
source = ["src/kingdom"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
