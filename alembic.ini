[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# La URL real se arma en migrations/env.py a partir de DATABASE_URL.
sqlalchemy.url =

# Las revisiones se nombran 0001_..., 0002_... a mano, en el mismo orden que
# los archivos de migrations/sql/. No usamos hashes autogenerados.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
